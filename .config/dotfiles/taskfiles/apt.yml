version: "3"

vars:
  # PPAs needed by packages in APT_PKGS. One per line, `#` comments allowed.
  # Installed by `task apt:ppas`.
  PPAS: |
    #

  # apt packages for a fresh machine. One per line, `#` comments allowed.
  # Installed by `task apt:install`.
  APT_PKGS: |
    # CLI
    apt-file
    bat
    clang-format
    clangd
    colordiff
    cppcheck
    curl
    debian-goodies
    entr
    eza
    fd-find
    ffmpeg
    flac
    gdebi-core
    git
    grep
    htop
    hwinfo
    jq
    neofetch
    numlockx
    picocom
    python3-argcomplete
    rar
    ripgrep
    rsync
    tidy
    tmux
    unzip
    wget
    xclip
    xdg-utils
    zsh

    # GUI
    gparted
    gsmartcontrol
    keepassxc
    peek
    qbittorrent

    # Build
    build-essential
    cmake
    libfuse2t64
    libgtk-3-dev
    pkg-config

    ## pyenv
    libbz2-dev
    libffi-dev
    liblzma-dev
    libncursesw5-dev
    libreadline-dev
    libsqlite3-dev
    libssl-dev
    libxml2-dev
    libxmlsec1-dev
    llvm
    tk-dev
    xz-utils
    zlib1g-dev

    ## alacritty
    libegl1-mesa-dev
    libfontconfig1-dev
    libfreetype6-dev
    libxcb-xfixes0-dev
    libxkbcommon-dev

    ## any-term-dropdown
    coreutils
    libxcb-cursor-dev
    libxcb-util-dev
    xdotool

tasks:
  ppas:
    internal: true
    cmds:
      - |
        added=0
        while IFS= read -r ppa; do
          [[ -z "$ppa" || "$ppa" == \#* ]] && continue
          sudo add-apt-repository -y "$ppa"
          added=1
        done <<< "{{.PPAS}}"
        # add-apt-repository already refreshes lists itself; only re-run when
        # nothing was added (e.g. empty PPAS) and the cache might be stale.
        [[ "$added" -eq 0 ]] && sudo apt-get update -qq
        exit 0

  packages:
    internal: true
    cmds:
      - |
        pkgs=$(grep -vE '^\s*#|^\s*$' <<< "{{.APT_PKGS}}")
        if sudo apt-get install -y $pkgs; then
          exit 0
        fi
        echo "W: bulk apt install failed - retrying one package at a time to isolate the bad one(s)" >&2
        failed=""
        while IFS= read -r pkg; do
          sudo apt-get install -y "$pkg" || failed="$failed $pkg"
        done <<< "$pkgs"
        if [[ -n "$failed" ]]; then
          echo "E: failed to install: $failed" >&2
          exit 1
        fi

  install:
    desc: Add PPAs and install every apt package
    cmds:
      - task: ppas
      - task: packages

  update:
    desc: Refresh package lists, upgrade every apt package, and drop what's no longer needed
    cmds:
      - sudo apt-get update -qq
      - sudo apt-get full-upgrade -y
      - sudo apt-get autoremove -y
