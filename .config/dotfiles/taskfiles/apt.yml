version: "3"

vars:
  # PPAs needed by packages in APT_PKGS. One entry per line, `#` comments allowed.
  PPAS: |
    #

  # apt packages for a fresh machine. One package per line, `#` comments allowed.
  # Installed in a single `apt-get install` call by `task apt:install`.
  APT_PKGS: |
    # CLI tools
    bat
    apt-file
    clangd
    curl
    fd-find
    git
    grep
    ripgrep
    tidy
    unzip
    wget
    xclip
    xdg-utils
    libgtk-3-dev
    neofetch
    zsh
    tmux
    ffmpeg
    gdebi-core
    numlockx
    flac
    hwinfo
    rar
    clang-format
    colordiff
    cppcheck
    debian-goodies
    eza
    picocom
    python3-argcomplete
    jq
    rsync
    entr
    htop

    # GUI apps
    keepassxc
    gsmartcontrol
    qbittorrent
    gparted
    peek

    # pyenv build dependencies
    build-essential
    libssl-dev
    zlib1g-dev
    libbz2-dev
    libreadline-dev
    libsqlite3-dev
    llvm
    libncursesw5-dev
    xz-utils
    tk-dev
    libxml2-dev
    libxmlsec1-dev
    libffi-dev
    liblzma-dev

    # alacritty build dependencies
    cmake
    pkg-config
    libfreetype6-dev
    libfontconfig1-dev
    libxcb-xfixes0-dev
    libxkbcommon-dev
    libegl1-mesa-dev

    # any-term-dropdown dependencies
    coreutils
    xdotool
    libxcb-util-dev
    libxcb-cursor-dev

    # appimage dependency
    libfuse2t64

tasks:
  ppas:
    internal: true
    cmds:
      - |
        added=0
        while IFS= read -r ppa; do
          [[ -z "$ppa" || "$ppa" == \#* ]] && continue
          sudo add-apt-repository -y "$ppa"
          added=1
        done <<< "{{.PPAS}}"
        # add-apt-repository already refreshes lists itself; only re-run when
        # nothing was added (e.g. empty PPAS) and the cache might be stale.
        [[ "$added" -eq 0 ]] && sudo apt-get update -qq
        exit 0

  packages:
    internal: true
    cmds:
      - |
        pkgs=$(grep -vE '^\s*#|^\s*$' <<< "{{.APT_PKGS}}")
        if sudo apt-get install -y $pkgs; then
          exit 0
        fi
        echo "W: bulk apt install failed - retrying one package at a time to isolate the bad one(s)" >&2
        failed=""
        while IFS= read -r pkg; do
          sudo apt-get install -y "$pkg" || failed="$failed $pkg"
        done <<< "$pkgs"
        if [[ -n "$failed" ]]; then
          echo "E: failed to install:$failed" >&2
          exit 1
        fi

  install:
    desc: Add PPAs and install every apt package
    cmds:
      - task: ppas
      - task: packages

  update:
    desc: Refresh package lists, upgrade every apt package, and drop what's no longer needed
    cmds:
      - sudo apt-get update -qq
      - sudo apt-get full-upgrade -y
      - sudo apt-get autoremove -y
