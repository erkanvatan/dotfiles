version: "3"

vars:
  FONT_DIR: /usr/share/fonts/truetype/MesloLGS

  # Global npm packages. One per line, `#` comments allowed.
  # Installed together by `task cli:npm-globals`.
  NPM_PKGS: |
    js-beautify
    live-server
    livedown
    neovim
    npm-check-updates
    sass
    sql-lint
    tldr

  # pipx-installed apps. One per line, `#` comments allowed.
  # Installed one at a time by `task cli:pipx-apps` (pipx install takes a single spec).
  PIPX_PKGS: |
    black
    flake8
    isort
    jedi-language-server
    pipreqs
    pycodestyle
    pynvim
    yt-dlp

  # cargo-installed binaries. One per line, `#` comments allowed.
  # Installed one at a time by `task cli:cargo-apps`.
  CARGO_PKGS: |
    alacritty
    neocmakelsp

tasks:
  keygen:
    desc: Generate an SSH key if one doesn't exist yet
    status:
      - test -f "$HOME/.ssh/id_ed25519.pub"
    cmds:
      - |
        SSH_KEY_PASSPHRASE="{{.SSH_KEY_PASSPHRASE}}"
        if [ -z "$SSH_KEY_PASSPHRASE" ]; then
          read -s -p "Enter passphrase for new SSH key: " SSH_KEY_PASSPHRASE
          echo
        fi
        ssh-keygen -t ed25519 -f "$HOME/.ssh/id_ed25519" -C "${GIT_EMAIL:?set GIT_EMAIL in .config/dotfiles/.env}" -N "$SSH_KEY_PASSPHRASE"
      - echo "-> register this public key with GitHub as BOTH an Authentication key and a Signing key:"
      - cat "$HOME/.ssh/id_ed25519.pub"

  git-identity:
    internal: true
    cmds:
      - git config --global user.name "${GIT_NAME:-$(whoami)}"
      - git config --global user.email "${GIT_EMAIL:?set GIT_EMAIL in .config/dotfiles/.env}"
      - git config --global color.ui true
      - git config --global core.editor vim
      - git config --global gpg.format ssh
      - git config --global user.signingkey "$HOME/.ssh/id_ed25519.pub"
      - git config --global commit.gpgsign true
      - git config --global tag.gpgsign true

  font:
    internal: true
    status:
      - test -d "{{.FONT_DIR}}"
    cmds:
      - |
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        base='https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF'
        curl -fsSL "$base%20Regular.ttf" -o "$tmp/MesloLGS-Regular.ttf"
        curl -fsSL "$base%20Bold.ttf" -o "$tmp/MesloLGS-Bold.ttf"
        curl -fsSL "$base%20Italic.ttf" -o "$tmp/MesloLGS-Italic.ttf"
        curl -fsSL "$base%20Bold%20Italic.ttf" -o "$tmp/MesloLGS-BoldItalic.ttf"
        sudo mkdir -p "{{.FONT_DIR}}"
        sudo cp "$tmp"/*.ttf "{{.FONT_DIR}}/"
        fc-cache -f "{{.FONT_DIR}}"

  submodules:
    internal: true
    cmds:
      - git --git-dir="$HOME/.dotfiles" --work-tree="$HOME" submodule update --init --remote --recursive

  tpm:
    internal: true
    cmds:
      - "$HOME/.tmux/plugins/tpm/bin/install_plugins"

  swift-map:
    internal: true
    status:
      - test -x "$HOME/programs/swift-map/mainloop.py"
    cmds:
      - chmod +x "$HOME/programs/swift-map/mainloop.py"
      - |
        echo "Installing swift-map's keyboard layout system-wide"
        sudo "$HOME/programs/swift-map/mainloop.py" install

  wmutils:
    internal: true
    status:
      - test -d "$HOME/programs/core"
    cmds:
      - mkdir -p "$HOME/programs"
      - git clone https://github.com/wmutils/core.git "$HOME/programs/core"
      - make -C "$HOME/programs/core"
      - sudo make -C "$HOME/programs/core" install

  fzf:
    internal: true
    status:
      - test -x "$HOME/.fzf/install"
    cmds:
      - "$HOME/.fzf/install --all --no-update-rc"

  fzf-update:
    internal: true
    cmds:
      - "$HOME/.fzf/install --all --no-update-rc"

  npm-globals:
    internal: true
    cmds:
      - |
        [[ -s "$NVM_DIR/nvm.sh" ]] && . "$NVM_DIR/nvm.sh"
        command -v npm >/dev/null || { echo "W: npm not found (install node first), skipping" >&2; exit 0; }
        pkgs=$(grep -vE '^\s*#|^\s*$' <<< "{{.NPM_PKGS}}")
        if [[ -n "$pkgs" ]]; then
          echo "$pkgs" | xargs npm i -g --quiet
        fi

  pipx-apps:
    internal: true
    cmds:
      - |
        command -v pipx >/dev/null || { echo "W: pipx not found, skipping" >&2; exit 0; }
        grep -vE '^\s*#|^\s*$' <<< "{{.PIPX_PKGS}}" | xargs -r -n1 pipx install
        pipx upgrade-all

  rustup:
    internal: true
    status:
      - test -x "$HOME/.cargo/bin/rustup"
    cmds:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path

  rustup-update:
    internal: true
    cmds:
      - |
        [[ -s "$HOME/.cargo/env" ]] && . "$HOME/.cargo/env"
        command -v rustup >/dev/null && rustup update

  cargo-apps:
    internal: true
    cmds:
      - |
        [[ -s "$HOME/.cargo/env" ]] && . "$HOME/.cargo/env"
        command -v cargo >/dev/null || { echo "W: cargo not found, skipping" >&2; exit 0; }
        grep -vE '^\s*#|^\s*$' <<< "{{.CARGO_PKGS}}" | xargs -r -n1 cargo install --locked

  install:
    desc: One-time per-user setup - git identity, shell, font, prezto/tpm submodules, ~/programs, fzf, npm/pipx/cargo apps
    cmds:
      - task: keygen
        vars:
          SSH_KEY_PASSPHRASE: "{{.SSH_KEY_PASSPHRASE}}"
      - task: git-identity
      - task: font
      - task: submodules
      - task: tpm
      - task: swift-map
      - task: wmutils
      - task: fzf
      - task: npm-globals
      - task: pipx-apps
      - task: rustup
      - task: cargo-apps

  update:
    desc: Update prezto/tpm submodules and plugins, fzf, and all npm/pipx/cargo apps
    cmds:
      - task: submodules
      - task: tpm
      - task: fzf-update
      - task: npm-globals
      - task: pipx-apps
      - task: rustup-update
      - task: cargo-apps
