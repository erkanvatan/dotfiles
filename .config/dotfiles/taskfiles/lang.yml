version: "3"

# Runtimes and their package managers: nvm/node, pyenv/python, pipx.

tasks:
  nvm:
    internal: true
    status:
      - test -d "$HOME/.nvm"
    cmds:
      - |
        nvm_version=$(curl -fsSL https://api.github.com/repos/nvm-sh/nvm/releases/latest | jq -r '.tag_name // empty')
        if [[ -z "$nvm_version" ]]; then
          echo "E: could not resolve latest nvm release (offline, or GitHub API rate-limited - 60 unauthenticated requests/hour)" >&2
          exit 1
        fi
        curl -fsSL "https://raw.githubusercontent.com/nvm-sh/nvm/$nvm_version/install.sh" | bash

  node:
    internal: true
    status:
      - bash -c 'shopt -s nullglob; node=("$HOME"/.nvm/versions/node/*/bin/node); [[ ${#node[@]} -gt 0 ]]'
    cmds:
      - bash -lc '. "$NVM_DIR/nvm.sh"; nvm install --lts; nvm alias default node; nvm use --lts'

  pyenv:
    internal: true
    status:
      - test -d "$HOME/.pyenv"
    cmds:
      - curl -fsSL https://raw.githubusercontent.com/pyenv/pyenv-installer/master/bin/pyenv-installer | bash

  pyenv-pyright:
    internal: true
    status:
      - test -d "$HOME/.pyenv/plugins/pyenv-pyright"
    cmds:
      - bash -lc 'export PATH="$HOME/.pyenv/bin:$PATH"; eval "$(pyenv init --path)"; git clone https://github.com/alefpereira/pyenv-pyright.git "$(pyenv root)/plugins/pyenv-pyright"'

  python:
    internal: true
    status:
      - bash -lc 'export PATH="$HOME/.pyenv/bin:$PATH"; pyenv versions --bare | grep -q .'
    cmds:
      - |
        bash -lc '
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init --path)"
          eval "$(pyenv init -)"
          latest_python_version=$(pyenv install --list | grep -E "^\s*[0-9]+\.[0-9]+\.[0-9]+\s*$" | tail -1 | tr -d " ")
          pyenv install -s "$latest_python_version"
          pyenv global "$latest_python_version"
        '

  python-update:
    internal: true
    cmds:
      - |
        bash -lc '
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init --path)"
          eval "$(pyenv init -)"
          current=$(pyenv global)
          if [[ "$current" == system ]]; then
            echo "W: no pyenv global python set, skipping python update (run lang:install first)" >&2
            exit 0
          fi
          series=$(grep -oE "^[0-9]+\.[0-9]+" <<< "$current")
          latest_patch=$(pyenv install --list | grep -E "^\s*${series//./\\.}\.[0-9]+\s*$" | tail -1 | tr -d " ")
          if [[ -n "$latest_patch" && "$latest_patch" != "$current" ]]; then
            echo "> python $current -> $latest_patch"
            pyenv install -s "$latest_patch"
            pyenv global "$latest_patch"
          fi
        '

  pipx:
    internal: true
    status:
      - command -v pipx
    cmds:
      - '"$HOME/.pyenv/shims/python" -m pip install --user pipx'
      - '"$HOME/.pyenv/shims/python" -m pipx ensurepath'

  install:
    desc: Install nvm + latest LTS node, pyenv + latest python, pipx (one-time)
    cmds:
      - task: nvm
      - task: node
      - task: pyenv
      - task: pyenv-pyright
      - task: python
      - task: pipx

  update:
    desc: Update to latest LTS node, latest pyenv + python patch releases, pipx
    cmds:
      - bash -lc '. "$NVM_DIR/nvm.sh"; nvm install --lts --reinstall-packages-from=default; nvm alias default node'
      - bash -lc 'export PATH="$HOME/.pyenv/bin:$PATH"; pyenv update'
      - task: python-update
      - '"$HOME/.pyenv/shims/python" -m pip install --user -U pipx'
