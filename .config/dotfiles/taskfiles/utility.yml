version: "3"

vars:
  ROOTFS_DIR: '{{.ROOT_DIR}}/.config/dotfiles/rootfs'

tasks:
  bare-install:
    desc: "One-time: turn $HOME into this repo's bare Git checkout (run from a normal clone; REPO defaults to that clone's origin URL, or pass REPO=<url> to override)"
    vars:
      REPO:
        sh: git remote get-url origin 2>/dev/null
    preconditions:
      - sh: '[ -n "{{.REPO}}" ]'
        msg: "no origin remote found in this clone and no REPO given — pass your fork's clone URL, e.g. task utility:bare-install REPO=git@github.com:you/dotfiles.git"
    status:
      - git --git-dir="$HOME/.dotfiles" rev-parse --verify HEAD >/dev/null 2>&1
    interactive: true
    cmds:
      - git init --bare "$HOME/.dotfiles"
      - git --git-dir="$HOME/.dotfiles" --work-tree="$HOME" config --local status.showUntrackedFiles no
      - git --git-dir="$HOME/.dotfiles" --work-tree="$HOME" config --local core.worktree "$HOME"
      - git --git-dir="$HOME/.dotfiles" --work-tree="$HOME" remote add origin "{{.REPO}}" 2>/dev/null || git --git-dir="$HOME/.dotfiles" --work-tree="$HOME" remote set-url origin "{{.REPO}}"
      - |
        git --git-dir="$HOME/.dotfiles" --work-tree="$HOME" fetch origin master

        lsfile=$(mktemp)
        git --git-dir="$HOME/.dotfiles" ls-tree -r --name-only FETCH_HEAD > "$lsfile"
        conflicts=""
        while IFS= read -r f; do
          if [[ -e "$HOME/$f" ]] && ! git --git-dir="$HOME/.dotfiles" ls-files --error-unmatch "$f" >/dev/null 2>&1; then
            conflicts="$conflicts$f"$'\n'
          fi
        done < "$lsfile"
        rm -f "$lsfile"

        if [[ -n "$conflicts" ]]; then
          "{{.ROOT_DIR}}/scripts/task-note" "These files already exist in $HOME and would be overwritten by the clone:"
          printf '%s' "$conflicts"
          read -p "Move them aside and continue? [y/N] " ans
          if [[ "$ans" != "y" && "$ans" != "Y" ]]; then
            "{{.ROOT_DIR}}/scripts/task-note" "Aborted, nothing changed. Move or remove those files yourself and re-run this task."
            exit 1
          fi
          backup_dir="$HOME/.dotfiles-backup/$(date +%Y%m%d%H%M%S)"
          printf '%s' "$conflicts" | while IFS= read -r f; do
            mkdir -p "$backup_dir/$(dirname "$f")"
            mv "$HOME/$f" "$backup_dir/$f"
          done
          "{{.ROOT_DIR}}/scripts/task-note" "Moved conflicting files to $backup_dir"
        fi

        git --git-dir="$HOME/.dotfiles" --work-tree="$HOME" merge FETCH_HEAD
      - cd $HOME && git --git-dir="$HOME/.dotfiles" --work-tree="$HOME" submodule update --init --remote --recursive
      - |
        "{{.ROOT_DIR}}/scripts/task-note" \
          "$HOME is now the bare-repo work-tree (the 'config' alias from .zshrc works from your next shell)." \
          'cd $HOME, then run: task setup GIT_NAME="Your Name" GIT_EMAIL=you@example.com SSH_KEY_PASSPHRASE=...'
